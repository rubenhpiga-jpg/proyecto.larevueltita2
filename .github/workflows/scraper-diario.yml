name: Scraper Cultural Diario por IA

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔥 Este comando busca automáticamente la carpeta y ejecuta la instalación ahí adentro
      - name: Instalar dependencias
        run: |
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
          cd "$TARGET_DIR"
          npm install

      # 🔥 Este comando busca el bot e inyecta las credenciales de Supabase y Google
      - name: Ejecutar Bot de IA
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TARGET_DIR=$(find . -name "bot_ia.mjs" -not -path "*/node_modules/*" -exec dirname {} \;)
          cd "$TARGET_DIR"
          node bot_ia.mjs

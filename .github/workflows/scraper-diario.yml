name: Scraper Cultural Diario por IA

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔥 Entramos e instalamos todo en una sola línea unificada usando &&
      - name: Instalar dependencias
        run: cd proyecto.larevueltita2 && npm install

      # 🔥 Entramos y ejecutamos el bot en una sola línea unificada usando &&
      - name: Ejecutar Bot de IA
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: cd proyecto.larevueltita2 && node bot_ia.mjs

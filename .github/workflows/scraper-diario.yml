name: Scraper Cultural Diario por IA

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Busca automáticamente dónde está el package.json y lo instala ahí adentro
      - name: Instalar dependencias
        run: |
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
          echo "Carpeta encontrada: $TARGET_DIR"
          cd "$TARGET_DIR" && npm install

      # Busca dónde está tu archivo del bot y lo ejecuta inyectando las claves secretas
      - name: Ejecutar Bot de IA
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TARGET_DIR=$(find . -name "bot_ia.mjs" -not -path "*/node_modules/*" -exec dirname {} \;)
          cd "$TARGET_DIR" && node bot_ia.mjs

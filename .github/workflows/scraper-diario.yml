name: Scraper Cultural Diario por IA

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Indicar la subcarpeta de forma nativa para la instalación
      - name: Instalar dependencias
        working-directory: proyecto.larevueltita2
        run: npm install

      # Indicar la subcarpeta de forma nativa para la ejecución
      - name: Ejecutar Bot de IA
        working-directory: proyecto.larevueltita2
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node bot_ia.mjs
